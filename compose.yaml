services:
  database:
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Application-Code/backend
    restart: unless-stopped
    environment:
      MONGO_CONN_STR: mongodb://database:27017/todo
      PORT: 3500
    ports:
      - "3500:3500"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:3500/ok',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./Application-Code/frontend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      REACT_APP_BACKEND_URL: http://35.94.68.138:3500/api/tasks
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
